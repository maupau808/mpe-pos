<!doctype html>
<meta charset="utf-8">
<title>POS scanner reliability tests</title>
<style>
body { font: 14px/1.45 system-ui, sans-serif; margin: 20px; }
.pass { color: #176b2c; } .fail { color: #a51d25; font-weight: 700; }
iframe { position: fixed; width: 1200px; height: 800px; left: -2000px; top: 0; }
</style>
<h1>POS scanner reliability tests</h1>
<div id="summary">Running…</div>
<ol id="results"></ol>
<iframe id="pos"></iframe>
<iframe id="phone"></iframe>
<script>
const results = [];
const pos = document.getElementById('pos');
const phone = document.getElementById('phone');
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const waitFor = async (check, timeout = 30000) => {
  const started = Date.now();
  while (Date.now() - started < timeout) {
    if (check()) return;
    await sleep(25);
  }
  throw new Error('timed out');
};
const record = (name, ok, detail = '') => {
  results.push({ name, ok, detail });
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = `${ok ? 'PASS' : 'FAIL'} — ${name}${detail ? `: ${detail}` : ''}`;
  document.getElementById('results').appendChild(li);
};
const test = async (name, fn) => {
  try { await fn(); record(name, true); }
  catch (error) { record(name, false, error.message); }
};
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const frameWindow = frame => frame.contentWindow;
const loaded = frame => /^\d[\d,]* parts(?: loaded)?$/.test(frame.contentDocument.getElementById('partsCount')?.textContent || '');
const TEST_FEED = {
  parts: [
    { pn: 'TEST1001', og: 'TEST1001', desc: 'Scanner test item one', make: 'TEST', list: 10, cost: 5 },
    { pn: 'TEST2002', og: 'TEST2002', desc: 'Scanner test item two', make: 'TEST', list: 20, cost: 10 },
    { pn: 'TEST3003', og: 'TEST3003', desc: 'Scanner test item three', make: 'TEST', list: 30, cost: 15 },
    { pn: '23', og: '23', desc: 'Short scanner test item', make: 'TEST', list: 4, cost: 2 },
    { pn: '5555', og: '5555', desc: 'Distributor prefix test item', make: 'SCAG', list: 40, cost: 20 },
    { pn: 'UNIT1', og: 'UNIT1', desc: 'MX100 test unit', make: 'STIHL', list: 100, cost: 50, warranty: true },
    { pn: '22295', og: '22295', desc: 'Toro QR test mower', make: 'TORO', list: 1200, cost: 800, warranty: true },
    { pn: '664240', og: '664240', desc: 'EU2200i — Generator', make: 'Honda', list: 1199, cost: 959, warranty: true },
    { pn: '668790', og: '668790', desc: 'EU2200i (Companion) — Generator', make: 'Honda', list: 1299, cost: 1039, warranty: true },
    { pn: 'OLD1', og: 'OLD1', sup: 'NEW1', desc: 'Superseded scanner item', make: 'TEST', list: 5, cost: 2 },
    { pn: 'NEW1', og: 'NEW1', desc: 'Current scanner item', make: 'TEST', list: 6, cost: 3 },
    { pn: 'AMBIG1', og: 'AMBIG1', desc: 'Ambiguous scanner item A', make: 'TEST A', list: 7, cost: 3 },
    { pn: 'AMBIG1', og: 'AMBIG1', desc: 'Ambiguous scanner item B', make: 'TEST B', list: 8, cost: 4 },
    { pn: 'LABOR', og: 'LABOR', desc: 'Labor', make: 'SERVICE', list: 1, cost: 0 },
    { pn: 'METALHEADSWAP', og: 'METALHEADSWAP', desc: 'Fixed head installation', make: 'SERVICE', list: 1, cost: 0 },
  ],
  sales: [], serials: {},
  codes: {
    '1234567890123': 'TEST2002',
    '886661123456': 'UNIT1',
    '@UNIT-EXACT:SERIAL123': 'UNIT1',
    '@UNIT-EXACT:SERIAL456': 'UNIT1',
    '@UNIT-PREFIX:SNX': 'UNIT1',
    '@UNIT-EXACT:EAMT3283123': '664240',
    '@UNIT-EXACT:EAMT3203003': '668790',
    '@UNIT-PREFIX:EAMT': '664240',
  },
};
async function loadFixture(frame, delayMs = 0) {
  if (delayMs) await sleep(delayMs);
  const stream = new Blob([JSON.stringify(TEST_FEED)]).stream().pipeThrough(new CompressionStream('gzip'));
  const bytes = await new Response(stream).arrayBuffer();
  await frameWindow(frame).loadPosJsonBytes(bytes, 'scanner-test');
}
const filledRows = frame => [...frame.contentDocument.querySelectorAll('#searchRows tr[data-row] .part-input')]
  .filter(input => input.dataset.partPn).map(input => input.dataset.partPn);
const allProductValues = frame => [...frame.contentDocument.querySelectorAll('#searchRows tr[data-row] .part-input')]
  .map(input => input.value);
let acquisitionClock = 0;
function makeKey(key, stamp, init = {}) {
  const event = new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...init });
  Object.defineProperty(event, 'timeStamp', { value: stamp });
  if (init.isComposing) Object.defineProperty(event, 'isComposing', { value: true });
  return event;
}
function applyTextDefault(target, key, event) {
  if (event.defaultPrevented || key.length !== 1 || !(target instanceof target.ownerDocument.defaultView.HTMLInputElement
      || target instanceof target.ownerDocument.defaultView.HTMLTextAreaElement) || target.readOnly) return;
  const start = typeof target.selectionStart === 'number' ? target.selectionStart : target.value.length;
  const end = typeof target.selectionEnd === 'number' ? target.selectionEnd : start;
  target.value = target.value.slice(0, start) + key + target.value.slice(end);
  try { target.setSelectionRange(start + key.length, start + key.length); } catch (error) {}
  target.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: key }));
}
async function burst(frame, value, options = {}) {
  const doc = frame.contentDocument;
  const target = options.target || doc.body;
  const step = options.acquisitionStep ?? 5;
  const deliveryDelay = options.deliveryDelay ?? 0;
  const suffixGap = options.suffixGap ?? step;
  acquisitionClock = Math.max(acquisitionClock + (options.burstGap ?? 3000), frameWindow(frame).performance.now());
  let stamp = acquisitionClock;
  let lastKeyStamp = stamp;
  let keyIndex = 0;
  for (const key of String(value)) {
    lastKeyStamp = stamp;
    const event = makeKey(key, stamp, options.keyInit || {});
    target.dispatchEvent(event);
    if (options.simulateDefault) applyTextDefault(target, key, event);
    stamp += options.acquisitionDelays?.[keyIndex++] ?? step;
    if (deliveryDelay) await sleep(deliveryDelay);
  }
  const enter = makeKey(options.terminator || 'Enter', lastKeyStamp + suffixGap, options.enterInit || {});
  target.dispatchEvent(enter);
  acquisitionClock = lastKeyStamp + suffixGap;
  return enter.defaultPrevented;
}
function reset(frame, type = 'receipt') {
  const win = frameWindow(frame);
  win.clearAll();
  win.setDocType(type);
  win.setScannerModeActive(false);
}
function chooseCodes(win) {
  const preferred = ['TEST1001', 'TEST2002', 'TEST3003', '23', '1106', '1000', '664240', '668790'];
  const unique = preferred.filter(value => win.resolveScannedValue(value).candidates.length === 1);
  if (unique.length >= 3) return unique.slice(0, 3);
  const parts = win.eval('partsArray');
  const seen = new Set(unique);
  for (const part of parts) {
    const value = String(part.og || part.pn || '').trim();
    if (value && !seen.has(value) && win.resolveScannedValue(value).candidates.length === 1) {
      unique.push(value); seen.add(value);
      if (unique.length >= 3) break;
    }
  }
  return unique;
}

pos.addEventListener('load', async () => {
  try {
    await loadFixture(pos, 1);
    await waitFor(() => loaded(pos));
    await waitFor(() => typeof frameWindow(phone).loadPosJsonBytes === 'function');
    await loadFixture(phone, 1);
    await waitFor(() => frameWindow(phone).eval('loaded'));
    const win = frameWindow(pos);
    const [codeA, codeB, codeC] = chooseCodes(win);
    assert(codeA && codeB && codeC, 'three unique test parts not found');

    await test('phone scanner uses the compact labeled controls and camera strip', async () => {
      const doc = phone.contentDocument;
      const phoneWin = frameWindow(phone);
      assert(!doc.querySelector('.top'), 'retired MPE Scan header still exists');
      const labels = ['againBtn', 'searchBtn', 'reloadBtn', 'setBtn']
        .map(id => doc.getElementById(id)?.textContent.trim() || '');
      for (const label of ['Scan', 'Search', 'Reload', 'Settings']) {
        assert(labels.some(text => text.startsWith(label)), `${label} control is not visibly labeled`);
      }
      assert(doc.getElementById('bindBtn')?.closest('#setSheet'), 'Bind action did not move into Settings');
      assert(/bind barcodes to parts/i.test(doc.getElementById('bindBtn').closest('.set-row').textContent),
        'Bind action is not plainly labeled in Settings');
      doc.body.classList.add('bind');
      assert(phoneWin.getComputedStyle(doc.getElementById('searchBtn')).display === 'none',
        'Search remains available during the separate Bind workflow');
      doc.body.classList.remove('bind');
      const cameraHeight = doc.querySelector('.cam-wrap').getBoundingClientRect().height;
      assert(cameraHeight >= 95 && cameraHeight <= 97, `camera strip is ${cameraHeight}px tall`);
      const phoneCss = [...doc.querySelectorAll('style')].map(style => style.textContent).join('\n');
      assert(/\.cam-wrap video\s*\{[^}]*height:\s*auto/i.test(phoneCss),
        'camera preview is still forced into the slit ratio');
      assert(/\.cam-wrap video\s*\{[^}]*position:\s*absolute[^}]*translateY\(-50%\)/i.test(phoneCss),
        'camera preview is not a centered crop of its normal view');
      assert(doc.getElementById('listCount')?.closest('.list-head'), 'list count is not in the sticky List header');
    });

    await test('phone Reload control calls a real reload without clearing the saved list', async () => {
      const phoneWin = frameWindow(phone);
      const beforeSaved = phoneWin.localStorage.getItem('mpeScanList');
      phoneWin.eval("list = [{ id: 'reload-test', pn: 'TEST1001', desc: 'Reload test', make: 'TEST', qty: 1, price: 10 }]; persistList()");
      const saved = phoneWin.localStorage.getItem('mpeScanList');
      assert(/location\.reload\(\)/.test(phoneWin.reloadApp.toString()), 'Reload action is not backed by location.reload()');
      let loadedAgain = false;
      phone.addEventListener('load', () => { loadedAgain = true; }, { once: true });
      phone.contentDocument.getElementById('reloadBtn').click();
      await waitFor(() => loadedAgain);
      const reloadedWin = frameWindow(phone);
      assert(reloadedWin.localStorage.getItem('mpeScanList') === saved, 'Reload control cleared the saved list');
      assert(reloadedWin.eval("list.length === 1 && list[0].id === 'reload-test'"), 'Reload did not restore the saved list');
      if (beforeSaved === null) reloadedWin.localStorage.removeItem('mpeScanList');
      else reloadedWin.localStorage.setItem('mpeScanList', beforeSaved);
      reloadedWin.eval("list = JSON.parse(localStorage.getItem('mpeScanList') || '[]'); renderList()");
      await loadFixture(phone, 1);
      await waitFor(() => reloadedWin.eval('loaded'));
    });

    await test('phone camera visibility pause keeps a live stream and cancels decode work', async () => {
      const phoneWin = frameWindow(phone);
      phoneWin.eval(`
        window.__visibilityStops = 0;
        window.__liveVisibilityTrack = { readyState: 'live', stop: () => { window.__visibilityStops += 1; } };
        scanActive = true;
        scanPausedForVisibility = false;
        scanLoopVersion = 7;
        scanStream = {
          getVideoTracks: () => [window.__liveVisibilityTrack],
          getTracks: () => [window.__liveVisibilityTrack]
        };
        scanTimer = setTimeout(() => {}, 10000);
      `);
      phoneWin.pauseCameraForVisibility();
      assert(phoneWin.eval('scanPausedForVisibility && scanTimer === null'), 'hidden camera did not pause decode scheduling');
      assert(phoneWin.eval('scanLoopVersion === 8'), 'hidden camera did not invalidate its in-flight decode loop');
      assert(phoneWin.__visibilityStops === 0, 'hidden camera stopped its live track');
      assert(phoneWin.eval('cameraStreamIsUsable(scanStream)'), 'live stream was marked unusable');
      phoneWin.eval('scanPausedForVisibility = false; startActiveDecodeLoop(true)');
      assert(phoneWin.eval('scanPausedForVisibility && scanLoopVersion === 9'),
        'camera startup completed while hidden without entering resumable pause');
      phoneWin.eval('window.__staleTimer = setTimeout(() => {}, 10000); scanTimer = window.__staleTimer');
      await phoneWin.nativeFrame(8);
      assert(phoneWin.eval('scanTimer === window.__staleTimer'), 'stale foreground decode loop changed the active timer');
      phoneWin.eval('clearTimeout(window.__staleTimer); scanTimer = null');
      phoneWin.eval("window.__liveVisibilityTrack.readyState = 'ended'");
      assert(!phoneWin.eval('cameraStreamIsUsable(scanStream)'), 'ended stream was marked reusable');
      assert(/if \(!cameraStreamIsUsable\(scanStream\)\)/.test(phoneWin.resumeCameraAfterVisibility.toString()),
        'foreground resume does not gate reacquisition on an unusable stream');
      phoneWin.eval('scanActive = false; scanPausedForVisibility = false; scanStream = null; scanTimer = null; scanLoopVersion = 0');
    });

    await test('Scanner Mode idle status does not claim the camera is starting', async () => {
      win.setScannerModeActive(true);
      const status = pos.contentDocument.getElementById('scannerModeStatus').textContent.trim();
      assert(status === 'Ready for the next scan', `idle status was ${status}`);
      win.setScannerModeActive(false);
    });

    await test('Scanner Mode commands preserve hierarchy and crisp QR quiet zones', async () => {
      win.setScannerModeActive(true);
      const print = pos.contentDocument.getElementById('scannerModePrintCode');
      const clear = pos.contentDocument.getElementById('scannerModeClearCode');
      const undo = pos.contentDocument.getElementById('scannerModeUndoCode');
      const printRect = print.getBoundingClientRect();
      const clearRect = clear.getBoundingClientRect();
      const undoRect = undo.getBoundingClientRect();
      assert(printRect.width > clearRect.width, 'Print is not the strongest scanner target');
      assert(Math.abs(clearRect.width - undoRect.width) <= 2, 'Next transaction and Undo targets are mismatched');
      assert(print.compareDocumentPosition(clear) & Node.DOCUMENT_POSITION_FOLLOWING, 'Print is not first in workflow order');
      assert(clear.compareDocumentPosition(undo) & Node.DOCUMENT_POSITION_FOLLOWING, 'Undo is not last in workflow order');
      [print, clear, undo].forEach(code => {
        const rect = code.getBoundingClientRect();
        assert(code.getAttribute('viewBox') === '0 0 37 37', `QR quiet zone or grid changed (${code.getAttribute('viewBox')})`);
        assert(Math.abs(rect.width - rect.height) <= 2, `QR is not square (${Math.round(rect.width)} × ${Math.round(rect.height)})`);
      });
      assert(/Scan twice to clear/i.test(pos.contentDocument.getElementById('scannerModeNextCommand').textContent), 'Next transaction safety reminder is missing');
      win.setScannerModeActive(false);
    });

    await test('Scanner Mode Print, Next transaction, and Undo QRs decode to protected commands', async () => {
      const decodeQr = async id => {
        const svg = pos.contentDocument.getElementById(id);
        const markup = new XMLSerializer().serializeToString(svg);
        const image = new Image();
        const url = URL.createObjectURL(new Blob([markup], { type: 'image/svg+xml' }));
        try {
          image.src = url;
          await image.decode();
          const canvas = pos.contentDocument.createElement('canvas');
          canvas.width = canvas.height = 592;
          const context = canvas.getContext('2d');
          context.imageSmoothingEnabled = false;
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const api = await win.loadWindowsBarcodeDetector();
          const detector = new api.BarcodeDetector({ formats: ['qr_code'] });
          return (await detector.detect(canvas))[0]?.rawValue || '';
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      win.renderScannerModeCommandCodes();
      assert(await decodeQr('scannerModePrintCode') === '~MPE2:Q7X4:PRINT:8K3N', 'Print QR did not decode to its allowlisted command');
      assert(await decodeQr('scannerModeClearCode') === '~MPE2:Q7X4:CLEAR:2D9M', 'Next transaction QR did not decode to its allowlisted command');
      assert(await decodeQr('scannerModeUndoCode') === '~MPE2:Q7X4:UNDO:5R8P', 'Undo QR did not decode to its allowlisted command');
    });

    await test('Scanner Mode item names and line prices are large without colliding', async () => {
      reset(pos);
      win.applyPart(0, {
        pn: 'LONG-DISPLAY-ITEM',
        desc: 'Commercial straight-shaft brushcutter with adjustable bicycle handle',
        make: 'TEST', list: 1234.56, cost: 700
      }, { skipAddRow: true, skipFocus: true });
      win.setScannerModeActive(true);
      const line = pos.contentDocument.querySelector('#scannerModeLines .scanner-mode-line');
      const description = line.querySelector('.scanner-mode-description');
      const price = line.querySelector('.scanner-mode-price');
      const descStyle = win.getComputedStyle(description);
      const priceStyle = win.getComputedStyle(price);
      const descRect = description.getBoundingClientRect();
      const priceRect = price.getBoundingClientRect();
      assert(parseFloat(descStyle.fontSize) >= 26, `item name is only ${descStyle.fontSize}`);
      assert(parseFloat(priceStyle.fontSize) >= 28, `line price is only ${priceStyle.fontSize}`);
      assert(descRect.right + 10 <= priceRect.left, 'long item name collided with its price');
      assert(line.getBoundingClientRect().height >= 88, 'larger type is cramped into the old row height');
      reset(pos);
    });

    await test('unknown phone scan can carry new-item details without setting a price', async () => {
      const phoneWin = frameWindow(phone);
      phoneWin.eval('list = []; persistList()');
      phoneWin.addUnknown('012345678905', '00012345678905', 'ean_13');
      assert(phone.contentDocument.getElementById('searchSheet').classList.contains('open'), 'unknown scan did not open its decision sheet');
      phone.contentDocument.getElementById('newItemStart').click();
      phone.contentDocument.getElementById('newItemName').value = '8 in. pruning shear';
      phone.contentDocument.getElementById('newItemMake').value = 'Corona';
      phone.contentDocument.getElementById('newItemPrice').value = '$29.99 shelf';
      phone.contentDocument.getElementById('newItemNote').value = 'red handle';
      phone.contentDocument.getElementById('newItemSave').click();
      const row = phoneWin.eval("bridgeRowForEntry(list[0], '2026-08-14T12:00:00.000Z', 'TEST', 1)");
      assert(row[3] === '', 'unknown UPC became a Master part number');
      assert(row[4] === '8 in. pruning shear' && row[5] === 'Corona', 'new-item shorthand was lost');
      assert(row[7] === '', 'price note became a list price');
      assert(/new item.*UPC 00012345678905.*price note: \$29\.99 shelf.*red handle/i.test(row[9]), 'Bridge note lost UPC or context');
    });

    await test('edited Other rows remain separate new Master candidates', async () => {
      win.savePriceChanges([]);
      const editOther = (pn, desc, price, cost) => {
        win.applyPart(0, { pn: 'Other', desc: 'Other', make: 'Other', list: 0, cost: 0 }, { skipAddRow: true, skipFocus: true });
        const input = pos.contentDocument.querySelector('#searchRows [data-row="0"].part-input');
        input.value = pn;
        input.dataset.partPn = pn;
        pos.contentDocument.getElementById('desc-0').textContent = desc;
        pos.contentDocument.getElementById('price-0').dataset.price = String(price);
        pos.contentDocument.getElementById('cost-0').dataset.cost = String(cost);
        win.logOtherSuggestion(0);
      };
      editOther('NEW-ONE', 'First edited Other item', 24.99, 12.5);
      win.clearAll();
      editOther('NEW-TWO', 'Second edited Other item', 39.99, 20);
      const changes = win.getPriceChanges();
      assert(changes.length === 2, `expected 2 candidates, found ${changes.length}`);
      assert(new Set(changes.map(c => c.rowKey)).size === 2, 'row reuse overwrote a pending candidate');
      assert(changes.every(c => c.kind === 'newItem' && c.make === '@NEW'), 'candidate is not eligible for Bridge Pull new-item review');
      win.renderPriceChanges();
      assert(pos.contentDocument.querySelectorAll('.pc-new-item-pill').length === 2, 'new Master eligibility is not visible in Uploads');
      win.savePriceChanges([]);
      win.clearAll();
    });

    await test('regular mode accepts a hardware burst', async () => {
      reset(pos); await burst(pos, codeA);
      assert(filledRows(pos).length === 1, 'scan did not add one row');
    });

    await test('prevented page keys cannot silence a hardware burst', async () => {
      reset(pos); win.eval('scanRecentValues.clear()');
      const doc = pos.contentDocument;
      const blocker = event => event.preventDefault();
      doc.addEventListener('keydown', blocker, true);
      try { await burst(pos, codeA); }
      finally { doc.removeEventListener('keydown', blocker, true); }
      assert(filledRows(pos).length === 1, 'a prevented page key silenced the scanner');
    });

    await test('browser resume re-arms scanner capture', async () => {
      reset(pos); win.removeEventListener('keydown', win.onHardwareScanKeydown, true);
      win.dispatchEvent(new PageTransitionEvent('pageshow', { persisted: true }));
      await burst(pos, codeB);
      assert(filledRows(pos).length === 1, 'scanner listener stayed detached after resume');
    });

    await test('idle never changes the register into Scanner Mode', async () => {
      reset(pos);
      assert(win.eval("typeof SCANNER_IDLE_MS === 'undefined' && typeof _scannerIdleTimer === 'undefined'"),
        'an automatic Scanner Mode idle transition is still armed');
      assert(!pos.contentDocument.body.classList.contains('scanner-mode-active'), 'regular POS did not remain active');
    });

    await test('product-field focus is restored', async () => {
      reset(pos); const input = pos.contentDocument.querySelector('#searchRows .part-input');
      input.value = 'KEEP'; input.focus(); input.setSelectionRange(2, 2);
      await burst(pos, codeA, { target: input, simulateDefault: true });
      assert(input.value === 'KEEP' && input.selectionStart === 2, 'focused product field was changed');
      assert(filledRows(pos).length === 1, 'focused-field scan did not add');
    });

    await test('customer-field focus is restored', async () => {
      reset(pos); const input = pos.contentDocument.getElementById('custName');
      input.value = 'KEEP CUSTOMER'; input.focus(); input.setSelectionRange(4, 4);
      await burst(pos, codeB, { target: input, simulateDefault: true });
      assert(input.value === 'KEEP CUSTOMER' && input.selectionStart === 4, 'customer field was changed');
      assert(filledRows(pos).length === 1, 'customer-focus scan did not add');
    });

    await test('history preserves line casing while customer values stay in caps', async () => {
      reset(pos); const doc = pos.contentDocument;
      const input = doc.querySelector('#searchRows .part-input');
      input.value = 'mix-Case'; input.dataset.partPn = 'mix-Case';
      doc.getElementById('desc-0').textContent = 'Mixed Description';
      doc.getElementById('price-0').dataset.price = '12.5';
      doc.getElementById('sub-0').dataset.val = '12.5';
      doc.getElementById('custName').value = 'Jane Doe';
      doc.getElementById('custEmail').value = 'Jane@Example.com';
      const order = win.captureOrder();
      assert(order.items[0].pn === 'mix-Case', `part saved as ${order.items[0].pn}`);
      assert(order.items[0].desc === 'Mixed Description', `description saved as ${order.items[0].desc}`);
      assert(order.customer.name === 'JANE DOE', `customer saved as ${order.customer.name}`);
      assert(order.customer.email === 'JANE@EXAMPLE.COM', `email saved as ${order.customer.email}`);
      const emailDoc = win.buildEmailDocHTML(order, 'Sales Receipt', 'TEST-1', 'August 17, 2026');
      assert(emailDoc.includes('Mixed Description'), 'email/PDF uppercased the line description');
      assert(emailDoc.includes('Mahalo for your business!'), 'email/PDF uppercased the Mahalo message');
      assert(emailDoc.includes('JANE DOE') && emailDoc.includes('text-transform:uppercase'), 'email/PDF customer values are not uppercase');
      const css = doc.querySelector('style').textContent;
      assert(!/body\s*\{[^}]*text-transform:\s*uppercase/i.test(css), 'print stylesheet still uppercases the whole receipt');
      assert(/\.print-customer,\s*\.wf-val,\s*\.inv-org\s*\{\s*text-transform:\s*uppercase/i.test(css), 'print customer values lost targeted uppercase styling');
    });

    await test('ZIP autofills town and state without overwriting a manual town', async () => {
      reset(pos); const doc = pos.contentDocument;
      const zip = doc.getElementById('custZip');
      const city = doc.getElementById('custCity');
      const state = doc.getElementById('custState');
      city.value = ''; state.value = ''; zip.value = '96793';
      win.autofillCityStateFromZip();
      assert(city.value === 'WAILUKU', `96793 town filled as ${city.value}`);
      assert(state.value === 'HI', `96793 state filled as ${state.value}`);
      city.value = 'CUSTOM TOWN'; zip.value = '96732';
      win.autofillCityStateFromZip();
      assert(city.value === 'CUSTOM TOWN', 'a manually corrected town was overwritten');
      assert(state.value === 'HI', `96732 state filled as ${state.value}`);
    });

    await test('Admin controls form a tight equal-height grid', async () => {
      const doc = pos.contentDocument;
      const menu = doc.getElementById('adminMenu');
      menu.classList.add('open');
      const controls = Array.from(menu.querySelector('.admin-control-grid').children)
        .filter(el => pos.contentWindow.getComputedStyle(el).display !== 'none');
      const heights = controls.map(el => Math.round(el.getBoundingClientRect().height));

      Object.defineProperty(win, 'mpeDesktop', {
        configurable: true,
        value: {
          printReceipt: async request => {
            bridgeCalls += 1;
            assert(Number.isFinite(request?.timing?.prepare_ms), 'desktop timing was not bounded data');
            return { ok: true };
          },
        },
      });
      win.fetch = async url => {
        if (String(url).includes('/pos-print')) helperCalls += 1;
        return originalFetch(url);
      };
      try {
        await win.autoPrint();
        await win.autoPrint();
      } finally {
        win.fetch = originalFetch;
        delete win.mpeDesktop;
      }
      assert(bridgeCalls === 1, `native bridge was called ${bridgeCalls} times`);
      assert(helperCalls === 0, `localhost helper was called ${helperCalls} times`);
      assert(win.getHistory().length === historyBefore + 1, 'desktop print did not save history exactly once');
      assert(filledRows(pos).length === 1, 'desktop Auto Print cleared the current sale');

      win.setScannerModeActive(false);

    await test('Undo command removes the last scanned line', async () => {
      reset(pos); await burst(pos, codeA); await burst(pos, '~MPE2:Q7X4:UNDO:5R8P');
      assert(filledRows(pos).length === 0, 'Undo did not remove line');
    });

    await test('service ADD command deliberately stacks', async () => {
      reset(pos); const add = '~MPE2:Q7X4:ADD-LABOR-30:4H6W';
      await burst(pos, add); await burst(pos, add, { burstGap: 120 });
      assert(filledRows(pos)[0] === 'LABOR', 'service command did not add Labor');
      assert(pos.contentDocument.getElementById('qty-0').value === '60', 'service command did not stack quantity');
    });

    await test('Scanner Mode click exits without clearing the sale', async () => {
      reset(pos); await burst(pos, codeB); win.setScannerModeActive(true);
      pos.contentDocument.getElementById('scannerModeView').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, isPrimary: true }));
      assert(!pos.contentDocument.body.classList.contains('scanner-mode-active'), 'click did not exit Scanner Mode');
      assert(filledRows(pos).length === 1, 'Scanner Mode exit cleared sale');
    });

    await test('Scanner Mode exit cue is large red text pinned below the item rows', async () => {
      reset(pos); win.setScannerModeActive(true);
      const lines = pos.contentDocument.getElementById('scannerModeLines');
      const bar = pos.contentDocument.querySelector('.scanner-mode-exit-bar');
      assert(bar && lines.nextElementSibling === bar, 'exit bar is not directly below the item rows');
      const barRect = bar.getBoundingClientRect();
      const linesRect = lines.getBoundingClientRect();
      const listRect = pos.contentDocument.querySelector('.scanner-mode-list').getBoundingClientRect();
      const style = win.getComputedStyle(bar);
      assert(barRect.height >= 64, `exit bar is only ${Math.round(barRect.height)}px tall`);
      assert(Math.abs(barRect.width - linesRect.width) <= 1, 'exit bar does not span the item rows');
      assert(listRect.bottom - barRect.bottom <= 30, 'exit bar is not pinned to the bottom of the item section');
      assert(style.color === 'rgb(198, 40, 40)', `exit cue text is not red (${style.color})`);
      assert(style.backgroundColor === 'rgba(0, 0, 0, 0)', `exit cue still has a solid block (${style.backgroundColor})`);
      assert(/regular pos/i.test(bar.textContent), 'exit bar does not name the destination');
    });

    await test('fast-repeat rollback restores the long hardware guard', async () => {
      const rollback = document.createElement('iframe'); rollback.src = 'index.html?fastRepeat=0&scannerFixture=1'; document.body.appendChild(rollback);
      await new Promise(resolve => rollback.addEventListener('load', resolve, { once: true })); await loadFixture(rollback, 1); await waitFor(() => loaded(rollback));
      await burst(rollback, codeA, { burstGap: 3000 }); await burst(rollback, codeA, { burstGap: 120 });
      assert(filledRows(rollback).length === 1, 'rollback did not restore long guard');
      await burst(rollback, codeA, { burstGap: 2300 });
      assert(filledRows(rollback).length === 1, 'rollback rearm used a second sale line');
      assert(rollback.contentDocument.getElementById('qty-0').value === '2', 'rollback guard did not rearm'); rollback.remove();
    });

    await test('scan received during catalog load is replayed in order', async () => {
      const fresh = document.createElement('iframe'); fresh.src = 'index.html?fastRepeat=1&scannerFixture=500&fresh=' + Date.now();
      fresh.style.cssText = pos.style.cssText; document.body.appendChild(fresh);
      await new Promise(resolve => fresh.addEventListener('load', resolve, { once: true }));
      const freshWin = frameWindow(fresh);
      const beforeReady = !loaded(fresh);
      await burst(fresh, codeA, { burstGap: 3000 });
      await burst(fresh, codeA, { burstGap: 120 });
      await loadFixture(fresh, 500);
      await waitFor(() => loaded(fresh)); await waitFor(() => fresh.contentDocument.getElementById('qty-0')?.value === '2');
      assert(beforeReady, 'test feed loaded before early-scan check');
      assert(filledRows(fresh).length === 1, 'held same-item scans used separate sale lines');
      assert(fresh.contentDocument.getElementById('qty-0').value === '2', 'held scans were not replayed');
      fresh.remove();
    });

    await test('startup rush queues every scan without reordering', async () => {
      const fresh = document.createElement('iframe'); fresh.src = 'index.html?fastRepeat=1&scannerFixture=1000&fresh=' + Date.now();
      document.body.appendChild(fresh); await new Promise(resolve => fresh.addEventListener('load', resolve, { once: true }));
      for (let i = 0; i < 25; i++) {
        const code = i % 2 ? codeB : codeA;
        await burst(fresh, code, { burstGap: i ? 20 : 3000 });
      }
      assert(filledRows(fresh).length === 0, 'startup scans ran before catalog readiness');
      await loadFixture(fresh, 500); await waitFor(() => fresh.contentDocument.getElementById('qty-0')?.value === '13'
        && fresh.contentDocument.getElementById('qty-1')?.value === '12');
      assert(filledRows(fresh).join(',') === `${codeA},${codeB}`, 'startup queue changed first-seen item order');
      assert(fresh.contentDocument.getElementById('qty-0').value === '13'
        && fresh.contentDocument.getElementById('qty-1').value === '12', 'startup queue lost scans'); fresh.remove();
    });

    await test('Scanner Mode holds and then renders a startup scan', async () => {
      const fresh = document.createElement('iframe'); fresh.src = 'index.html?fastRepeat=1&scannerFixture=500&fresh=' + Date.now();
      document.body.appendChild(fresh); await new Promise(resolve => fresh.addEventListener('load', resolve, { once: true }));
      frameWindow(fresh).setScannerModeActive(true); await burst(fresh, codeC, { burstGap: 3000 });
      assert(/Held 1 scan/.test(fresh.contentDocument.getElementById('scannerModeStatus').textContent), 'held-scan feedback missing');
      await loadFixture(fresh, 300); await waitFor(() => filledRows(fresh).length === 1);
      assert(fresh.contentDocument.getElementById('scannerModeLines').textContent.includes('Scanner test item three'), 'held scan did not render'); fresh.remove();
    });

    await test('license data never becomes a product scan', async () => {
      reset(pos); const fakeLicense = '@\nANSI 6360000000000000\nDAQTEST000\nDCSDOE\nDACJANE\nDAG123 TEST ST\nDAIANYTOWN\nDAJHI\nDAK967930000';
      win.acceptDecodedScan(fakeLicense, 'hardware', { acceptedAt: Date.now() + 300000 });
      assert(/jane/i.test(pos.contentDocument.getElementById('custName').value), 'license did not fill customer');
      assert(filledRows(pos).length === 0, 'license became a sale line');
    });

    await test('rows expand when every visible row is full', async () => {
      reset(pos); await burst(pos, codeA); await burst(pos, codeB); await burst(pos, codeC); await burst(pos, '5555');
      assert(filledRows(pos).length === 4, 'fourth scan did not add');
      assert(pos.contentDocument.querySelectorAll('#searchRows tr[data-row]').length >= 4, 'row table did not expand');
    });

  } catch (error) {
    record('test harness setup', false, error.message);
  } finally {
    const failed = results.filter(result => !result.ok).length;
    document.getElementById('summary').textContent = `${results.length - failed}/${results.length} passed`;
    document.body.dataset.done = '1';
    document.body.dataset.failed = String(failed);
  }
});
phone.src = 'scan.html?scannerFixture=1';
pos.src = 'index.html?fastRepeat=1&scannerFixture=1';
</script>
