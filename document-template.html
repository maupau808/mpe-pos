<template data-name="counter.css">
    @page{size:Letter;margin:1.5cm}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#000;font:14px/1.4 Arial,Helvetica,sans-serif}
    .wrap{max-width:8.5in;margin:0 auto;padding:1.5cm}
    .print-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:4px}
    .print-header img{display:block;max-height:47px;filter:grayscale(1) contrast(2)}
    .print-co{font-size:20px;font-weight:700}
    .print-contact{font-size:13px;margin-top:3px;line-height:1.5}
    .titlerow{display:flex;align-items:baseline;gap:10px;margin:2px 0 0;border-bottom:2px solid #000;padding-bottom:6px}
    .doctitle{font-size:22px;font-weight:800;letter-spacing:.02em;margin-top:14px;text-transform:uppercase}
    .docnum{font-size:13px;font-weight:600}
    .rev{font-size:13px;font-style:italic}
    .date{margin-left:auto;text-align:right;font-size:13px;font-weight:600}
    .date .due{display:block;font-weight:700}
    .refs{font-size:13px;margin-top:6px}
    .bill{margin:10px 0 12px;padding:8px 10px;border-left:3px solid #000;font-size:12px;line-height:1.45;overflow-wrap:anywhere;break-inside:avoid}
    .bill-label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
    .bill-name{font-weight:700}
    table{width:100%;table-layout:fixed;border-collapse:collapse}
    th{font-size:10px;border-bottom:1px solid #999;padding:4px 3px;text-align:left;text-transform:uppercase;letter-spacing:.04em}
    td{border-bottom:1px solid #ddd;padding:4px 3px;font-size:13px;vertical-align:top;overflow-wrap:anywhere}
    tr{break-inside:avoid}
    th.r,td.r{text-align:right}th.c,td.c{text-align:center}
    .orig{color:#555;font-size:12px;text-decoration:line-through}
    .off{display:block;font-size:11px}
    tr.sn td{padding-left:18%;font-size:12px}
    tr.note td{font-style:italic}
    .notes{display:flex;align-items:flex-start;gap:4px;margin:10px 0 0;font-size:14px;white-space:pre-wrap}
    .notes b{font-size:11px;font-weight:600;white-space:nowrap;padding-top:1px}
    .totals-row{display:flex;align-items:center;gap:24px;margin-top:6px;break-inside:avoid}
    .mahalo{flex:1;text-align:center;font-size:14px;font-style:italic;letter-spacing:.03em}
    .summary{width:3in;border-top:1px solid #999;padding-top:6px}
    .sum{display:flex;justify-content:space-between;padding:3px 0}
    .sum.total,.sum.due{border-top:1px solid #999;margin-top:3px;padding-top:5px;font-size:16px;font-weight:700}
    .sum.due{border-top-color:#000}
    .cust{margin-top:16px;font-size:13px;line-height:1.8;text-transform:uppercase}.cust div:first-child{font-weight:600}
    .pay{margin-top:12px;border-top:1px solid #999;padding-top:8px;font-size:12px;break-inside:avoid}.pay p{margin:2px 0}
    .sig{margin-top:12px;break-inside:avoid}
    .sig-received{font-size:15px;font-weight:600;margin-bottom:8px}
    .sig-line{font-size:14px;margin-bottom:10px;display:flex;align-items:flex-end;gap:8px}
    .sig-underline{display:inline-block;border-bottom:1px solid #000;width:200px;height:18px}
    @media(max-width:700px){.wrap{padding:18px}.totals-row{display:block}.summary{width:100%}}
    @media print{.wrap{max-width:none;padding:0}}
</template>
<template data-name="counter.page">
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{title}} {{number}} - {{shop_name}}</title>
  <style>
{{css}}
</style>
</head>
<body><main class="wrap">
  <div class="print-header"><div><div class="print-co">{{shop_name}}</div><div class="print-contact">{{contact}}</div></div><div><img src="{{logo}}" alt=""></div></div>
  <div class="titlerow"><span class="doctitle">{{title}}</span><span class="docnum">No. {{number}}</span>{{revised}}<span class="date">{{due}}{{date}}</span></div>
  {{refs}}
  {{bill}}
  <table><colgroup><col style="width:18%"><col style="width:48%"><col style="width:12%"><col style="width:8%"><col style="width:14%"></colgroup><thead><tr><th>Product</th><th>Description</th><th class="r">{{ea}}</th><th class="c">Qty</th><th class="r">Price</th></tr></thead><tbody>{{rows}}</tbody></table>
  {{note}}
  <div class="totals-row"><div class="mahalo">{{closing}}</div><div class="summary">{{sums}}</div></div>
  {{after}}
  {{pay}}
  {{sig}}
</main></body></html>

</template>
<template data-name="counter.ea">
Ea.
</template>
<template data-name="counter.due.terms">
<span class="due">{{terms}} Due Date: {{mm}}/{{dd}}/{{yy}}</span>
</template>
<template data-name="counter.due.quote">
<span class="due">Valid until {{valid_until}}</span>
</template>
<template data-name="counter.refs">
<div class="refs">{{refs}}</div>
</template>
<template data-name="counter.bill">
<div class="bill"><div class="bill-label">Bill to</div><div class="bill-name">{{name}}</div>{{rest}}</div>
</template>
<template data-name="counter.cust">
<div class="cust">{{lines}}</div>
</template>
<template data-name="counter.note">
<div class="notes"><b>Notes:</b><span>{{text}}</span></div>
</template>
<template data-name="counter.pay">
<div class="pay">{{paragraphs}}</div>
</template>
<template data-name="counter.sig">
<div class="sig"><div class="sig-received">Received by:</div><div class="sig-line">Print: <span class="sig-underline"></span></div><div class="sig-line">Sign: <span class="sig-underline"></span></div></div>
</template>
<template data-name="counter.row">
<tr><td>{{part}}</td><td>{{description}}</td><td class="r">{{each}}</td><td class="c">{{qty}}</td><td class="r">{{saved}}{{amount}}</td></tr>
</template>
<template data-name="counter.row.note">
<tr class="note"><td></td><td colspan="4">{{text}}</td></tr>
</template>
<template data-name="counter.row.serial">
<tr class="sn"><td colspan="5">Serial: {{serials}}</td></tr>
</template>
<template data-name="counter.orig">
<span class="orig">{{was}}</span> {{unit}}
</template>
<template data-name="counter.off">
<span class="off">({{amount}} off)</span>
</template>
<template data-name="counter.sum">
<div class="sum"><span>{{label}}</span><span>{{amount}}</span></div>
</template>
<template data-name="counter.sum.total">
<div class="sum total"><span>{{label}}</span><span>{{amount}}</span></div>
</template>
<template data-name="counter.sum.due">
<div class="sum due"><span>{{label}}</span><span>{{amount}}</span></div>
</template>
<template data-name="clean.css">
    @page{size:Letter;margin:.45in .5in}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#000;font:16px/1.4 Arial,Helvetica,sans-serif}
    .sheet{max-width:8.5in;margin:0 auto;padding:.45in .5in}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:2px solid #000;padding-bottom:12px}
    .shop strong{display:block;font-size:24px;line-height:1.15}
    .shop span{display:block;font-size:13px}
    .kind{text-align:right}
    .kind strong{display:block;font-size:34px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase}
    .kind span{display:block}
    .kind .no{font-size:19px;font-weight:700}
    .kind .rev{font-size:13px;font-style:italic}
    .meta{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;margin:18px 0 14px}
    .label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
    .bill{overflow-wrap:anywhere}
    dl{margin:0;display:grid;grid-template-columns:1in minmax(0,max-content);gap:1px 10px;align-items:baseline;justify-content:end;align-content:start;align-self:start;line-height:1.25;font-size:15px}
    dt{font-size:15px}dd{margin:0;font-weight:700;overflow-wrap:anywhere}
    table{width:100%;border-collapse:collapse}
    thead{display:table-header-group}
    th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:6px 6px;border-top:1px solid #000;border-bottom:1px solid #000}
    td{padding:7px 6px;border-bottom:1px solid #999;vertical-align:top;overflow-wrap:anywhere;font-size:15px}
    tr{break-inside:avoid}
    th.q,td.q{text-align:center;width:.55in}th.m,td.m{text-align:right;white-space:nowrap;width:1.1in}
    .sku{font-weight:700}.serial,.disc{font-size:12px;margin-top:2px}
    tr.note td{font-style:italic}
    .after{display:grid;grid-template-columns:1fr 3.1in;gap:28px;margin-top:14px;break-inside:avoid}
    .message{white-space:pre-wrap;overflow-wrap:anywhere}
    .totals{font-size:17px}
    .totals div{display:flex;justify-content:space-between;padding:3px 0}
    .totals .total{border-top:1px solid #000;margin-top:3px;padding-top:6px;font-size:19px;font-weight:700}
    .totals .due{border-top:2px solid #000;border-bottom:2px solid #000;margin-top:6px;padding:6px 0;font-size:21px;font-weight:700}
    .pay{margin-top:22px;border-top:1px solid #000;padding-top:9px;font-size:13px;break-inside:avoid}
    .pay p{margin:2px 0}
    @media(max-width:700px){.sheet{padding:18px}.top,.meta,.after{display:block}.kind{text-align:left;margin-top:12px}.totals{margin-top:14px}}
    @media print{.sheet{max-width:none;padding:0}}
</template>
