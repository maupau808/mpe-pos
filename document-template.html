<template data-name="counter.css">
    @page{size:Letter;margin:1.5cm}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#000;font:13px/1.4 Arial,Helvetica,sans-serif}
    .wrap{max-width:8.5in;margin:0 auto;padding:1.5cm}
    .print-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px}
    .print-header img{display:block;max-height:47px}
    .print-co{font-size:19px;font-weight:700}
    .print-contact{font-size:12px;margin-top:3px;line-height:1.5}
    .titlerow{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid #2d5635;padding-bottom:6px}
    .doctitle{font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
    .rev{font-size:12px;font-style:italic}
    .no{font-size:14px;font-weight:700}
    .titlerow:has(+table){border-bottom:0;padding-bottom:0}
    .titlerow+table{margin-top:10px}
    .date{margin-left:auto;text-align:right;font-size:13px;font-weight:700}
    .info{display:flex;align-items:flex-start;gap:16px;margin:12px 0 14px}
    .bill{flex:1;padding:1px 0 1px 10px;border-left:3px solid #2d5635;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
    .ordered{flex:1;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
    .box{flex:0 0 auto;margin-left:auto;display:grid;grid-template-columns:max-content max-content;column-gap:14px;align-items:baseline;font-size:12px;line-height:1.5}
    .bill-label,.ordered-label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
    .bill-name{font-weight:700}
    .boxrow{display:contents}.boxrow span{text-align:right}
    .boxrow b{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
    tr.nt td{text-align:center;font-style:italic;font-size:13px;padding:8px 4px}
    table{width:100%;table-layout:fixed;border-collapse:collapse;border-bottom:1px solid #2d5635}
    th{background:#e4ece5;color:#000;border-bottom:1px solid #2d5635;font-size:10px;font-weight:700;padding:5px 4px;text-align:left;text-transform:uppercase;letter-spacing:.05em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    td{border-bottom:1px solid #ddd;padding:3px 4px;font-size:12px;vertical-align:middle;overflow-wrap:anywhere}
    tr{break-inside:avoid}
    th.r,td.r{text-align:right}th.c,td.c{text-align:center}
    .mk{font-weight:700;font-size:12px;line-height:1.25}
    .pn{font-size:9px;line-height:1.2;color:#333}
    .orig{color:#555;font-size:11px;text-decoration:line-through}
    .off{display:block;font-size:10px}
    .sn{margin-top:1px;font-size:11px;color:#333}
    .notes{display:flex;align-items:flex-start;gap:4px;margin:10px 0 0;font-size:12px;white-space:pre-wrap}
    .notes b{font-size:11px;font-weight:600;white-space:nowrap;padding-top:1px}
    .totals-row{display:flex;align-items:flex-start;gap:28px;margin-top:12px;break-inside:avoid}
    .pay{flex:1;font-size:11px;line-height:1.5}.pay p{margin:0 0 8px}
    .summary{width:3in;margin-left:auto;padding-top:6px;font-size:12px}
    .sum{display:flex;justify-content:space-between;padding:3px 0}
    .sum.total,.sum.due{border-top:1px solid #2d5635;margin-top:3px;padding-top:5px;font-size:15px;font-weight:700}
    .mahalo{margin-top:18px;text-align:center;font-size:13px;font-style:italic;letter-spacing:.03em}
    .cust{margin-top:16px;font-size:12px;line-height:1.8;text-transform:uppercase}.cust div:first-child{font-weight:600}
    .sig{margin-top:26px;break-inside:avoid}
    .sig-received{font-size:16px;font-weight:700;margin-bottom:8px}
    .sig-line{font-size:15px;margin-bottom:32px;display:flex;align-items:flex-end;gap:8px}
    .sig-underline{display:inline-block;border-bottom:1px solid #000;width:200px;min-height:18px;padding-left:2px}.sig-underline:not(:empty){border-bottom:0}
    @media(max-width:700px){.wrap{padding:18px}.totals-row,.info{display:block}.summary{width:100%}}
    @media print{.wrap{max-width:none;padding:0}}
</template>

  <div class="titlerow"><span class="doctitle">{{title}}</span>{{numbered}}{{revised}}<span class="date">{{date}}</span></div>
  {{info}}

<template data-name="clean.css">
    @page{size:Letter;margin:.45in .5in}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#000;font:16px/1.4 Arial,Helvetica,sans-serif}
    .sheet{max-width:8.5in;margin:0 auto;padding:.45in .5in}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:2px solid #000;padding-bottom:12px}
    .shop strong{display:block;font-size:24px;line-height:1.15}
    .shop span{display:block;font-size:13px}
    .kind{text-align:right}
    .kind strong{display:block;font-size:34px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase}
    .kind span{display:block}
    .kind .no{font-size:19px;font-weight:700}
    .kind .rev{font-size:13px;font-style:italic}
    .meta{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;margin:18px 0 14px}
    .label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
    .bill{overflow-wrap:anywhere}
    dl{margin:0;display:grid;grid-template-columns:1in minmax(0,max-content);gap:1px 10px;align-items:baseline;justify-content:end;align-content:start;align-self:start;line-height:1.25;font-size:15px}
    dt{font-size:15px}dd{margin:0;font-weight:700;overflow-wrap:anywhere}
    table{width:100%;border-collapse:collapse}
    thead{display:table-header-group}
    th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:6px 6px;border-top:1px solid #000;border-bottom:1px solid #000}
    td{padding:7px 6px;border-bottom:1px solid #999;vertical-align:top;overflow-wrap:anywhere;font-size:15px}
    tr{break-inside:avoid}
    th.q,td.q{text-align:center;width:.55in}th.m,td.m{text-align:right;white-space:nowrap;width:1.1in}
    .sku{font-weight:700}.serial,.disc{font-size:12px;margin-top:2px}
    tr.note td{font-style:italic}
    .after{display:grid;grid-template-columns:1fr 3.1in;gap:28px;margin-top:14px;break-inside:avoid}
    .message{white-space:pre-wrap;overflow-wrap:anywhere}
    .totals{font-size:17px}
    .totals div{display:flex;justify-content:space-between;padding:3px 0}
    .totals .total{border-top:1px solid #000;margin-top:3px;padding-top:6px;font-size:19px;font-weight:700}
    .totals .due{border-top:2px solid #000;border-bottom:2px solid #000;margin-top:6px;padding:6px 0;font-size:21px;font-weight:700}
    .pay{margin-top:22px;border-top:1px solid #000;padding-top:9px;font-size:13px;break-inside:avoid}
    .pay p{margin:2px 0}
    @media(max-width:700px){.sheet{padding:18px}.top,.meta,.after{display:block}.kind{text-align:left;margin-top:12px}.totals{margin-top:14px}}
    @media print{.sheet{max-width:none;padding:0}}
</template>
<template data-name="clean.page">
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{title}} {{number}} - {{shop_name}}</title>
  <style>
{{css}}
</style>
</head>
<body><main class="sheet">
  <header class="top"><div class="shop"><strong>{{shop_name}}</strong>{{shop_lines}}</div><div class="kind"><strong>{{title}}</strong><span class="no">No. {{number}}</span>{{revised}}</div></header>
  <section class="meta"><div class="bill"><span class="label">Bill to</span>{{bill}}</div><dl>{{facts}}</dl></section>
  <table><thead><tr><th>Item</th><th>Description</th><th class="q">Qty</th><th class="m">Unit price</th><th class="m">Amount</th></tr></thead><tbody>{{rows}}</tbody></table>
  <section class="after">{{message}}<div class="totals">{{sums}}</div></section>
  <footer class="pay">{{pay}}</footer>
</main></body></html>

</template>
