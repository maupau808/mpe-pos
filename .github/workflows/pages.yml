name: Deploy POS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out POS
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static POS
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Load official Pages deployer
        uses: actions/checkout@v4
        with:
          repository: actions/deploy-pages
          ref: d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
          path: .pages-deploy-action

      - name: Extend Pages polling window
        run: |
          sed -i 's/const MAX_TIMEOUT = 600000/const MAX_TIMEOUT = 1800000/' .pages-deploy-action/dist/index.js
          grep -q 'const MAX_TIMEOUT = 1800000' .pages-deploy-action/dist/index.js

      - name: Deploy POS
        id: deployment
        uses: ./.pages-deploy-action
        with:
          timeout: 1800000
